# docker compose up -d   ->  http://localhost:8787 (set the password on first visit)
# Put HUHQ_SECRET_KEY, network app keys etc. in .env next to this file (see .env.example); app keys can also be pasted
# in Settings › App keys. For a public URL, put a reverse proxy / tunnel in front of 8787 (it answers the OAuth
# callbacks and media too); HuhQueue picks up that https URL when you sign in on it.
services:
  huhqueue:
    build: .
    image: huhqueue:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HUHQ_DATA_DIR: /data
      HUHQ_HOST: 0.0.0.0
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - huhqueue-data:/data

volumes:
  huhqueue-data:
