# Render Blueprint for HuhQueue: free web service; the database is Supabase Postgres (free, does not expire).
# Render's free Postgres is only kept while we copy it to Supabase (docs/SUPABASE.md); remove it after the move.
services:
  - type: web
    name: huhqueue-studio
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.studio
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_URL
        value: https://huhqueue-studio.onrender.com
      - key: BUFFER_CLIENT_ID
        sync: false
      - key: BUFFER_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_KEY             # seals Buffer tokens and AI keys at rest, separate from SESSION_SECRET (docs/SECURITY.md)
        sync: false
      - key: DATABASE_URL          # Supabase Session pooler URL (IPv4, port 5432)
        sync: false
      - key: RENDER_WORKER         # github = render Reels on free GitHub Actions
        value: github
      - key: GH_REPO
        value: dataanalystram/buffer-contest
      - key: GH_DISPATCH_TOKEN     # fine-grained PAT: Actions read/write on this repo only
        sync: false
      # who can open /admin: Buffer account ids or Buffer emails, comma-separated (docs/ADMIN.md); empty = nobody
      - key: HQ_ADMIN_IDS
        sync: false
databases:
  - name: huhqueue-studio-db
    plan: free
    region: frankfurt
