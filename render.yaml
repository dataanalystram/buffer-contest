# Render Blueprint for HuhQueue: free web service; the database is Supabase Postgres (free, does not expire).
# The old Render Postgres (huhqueue-studio-db) was deleted on 4 Nov 2026 after the move to Supabase; there is no database here.
services:
  - type: web
    name: huhqueue-studio
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.studio
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_URL
        value: https://huhqueue-studio.onrender.com
      - key: BUFFER_CLIENT_ID
        sync: false
      - key: BUFFER_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_KEY             # seals Buffer tokens and AI keys at rest, separate from SESSION_SECRET (docs/SECURITY.md)
        sync: false
      - key: DATABASE_URL          # Supabase Session pooler URL (IPv4, port 5432)
        sync: false
      - key: RENDER_WORKER         # github = render Reels on free GitHub Actions
        value: github
      - key: GH_REPO
        value: dataanalystram/buffer-contest
      - key: GH_DISPATCH_TOKEN     # fine-grained PAT: Actions read/write on this repo only
        sync: false
      - key: CHANNEL3_API_KEY      # Commerce (docs/COMMERCE.md): free tier only, hard stop at 1,000 credits/month in code
        sync: false
      # who can open /admin: Buffer account ids or Buffer emails, comma-separated (docs/ADMIN.md); empty = nobody
      - key: HQ_ADMIN_IDS
        sync: false
      # Cloudflare R2 bucket: One take's long uploads (docs/ONE_TAKE_UPLOADS.md) and, once set, all new media (docs/STORAGE.md);
      # off unless all four are set
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
