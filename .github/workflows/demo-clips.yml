name: demo-clips
# Renders the "Split a long video" demo bundle (Buffer's Buffer Commit kickoff Q&A -> 5 opus-style 9:16 clips) on the
# free GitHub worker: faster-whisper per moment window, built-in scorer, MediaPipe reframe, FFmpeg. No AI spend, no
# secrets. Nothing hosts the 89-minute source for you any more: pass its URL when you dispatch the run. The bundle is
# uploaded as an artifact and committed to studio/sample_take/ by hand after the contact sheets are checked.
on:
  workflow_dispatch:
    inputs:
      source: {description: "https URL of the source video (not stored anywhere by this repo)", required: true}
permissions: {contents: read}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-worker.txt}
      - run: bash scripts/ci_apt_install.sh ffmpeg libegl1 libgles2
      - run: pip install -q -r requirements-worker.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: ~/.cache/huggingface, key: whisper-small-v1}
      - name: Split the Buffer Commit kickoff into 5 clips
        env: {HQ_FACE_MODEL: "/tmp/blaze_face_short_range.tflite", HQ_SOURCE: "${{ github.event.inputs.source }}"}
        run: python scripts/demo_buffer_split.py --source "$HQ_SOURCE" --out demo_out --model small
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: demo-split-bundle, path: demo_out/, retention-days: 14}
