name: render
# Free video render worker for HuhQueue. The app dispatches one run per video job.
on:
  workflow_dispatch:
    inputs:
      job_id: {description: "render_jobs.id", required: true}
      app: {description: "app base URL", required: true, default: "https://huhqueue-studio.onrender.com"}
# No token in the inputs (they show on the run page): the run claims its job once with its GitHub OIDC identity.
permissions: {contents: read, id-token: write}
concurrency: {group: "render-${{ github.event.inputs.job_id }}", cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q httpx pillow
      - name: Render job ${{ github.event.inputs.job_id }}
        env: {HQ_JOB_ID: "${{ github.event.inputs.job_id }}", HQ_APP: "${{ github.event.inputs.app }}"}
        run: python -m studio.render_worker --job "$HQ_JOB_ID" --app "$HQ_APP"
