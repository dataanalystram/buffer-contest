name: render
# Free video render worker for HuhQueue. The app dispatches one run per video job: kinds slideshow, brand_video,
# template_video, media_render (studio.media styles) and media_recap (the weekly recap: carousel slides + one Reel).
on:
  workflow_dispatch:
    inputs:
      job_id: {description: "render_jobs.id", required: true}
      app: {description: "app base URL", required: true, default: "https://huhqueue-studio.onrender.com"}
# No token in the inputs (they show on the run page): the run claims its job once with its GitHub OIDC identity.
permissions: {contents: read, id-token: write}
concurrency: {group: "render-${{ github.event.inputs.job_id }}", cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # a weekly recap fetches 5-7 stories' media and renders ~8 videos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-media.txt}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      # studio.media (docs/MEDIA_PIPELINE.md): yt-dlp, faster-whisper, numpy. Video runs here, never on the 512 MB web dyno.
      - run: pip install -q -r requirements-worker-core.txt -r requirements-media.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: {path: ~/.cache/huggingface, key: whisper-media-tiny-v1}
      - name: Render job ${{ github.event.inputs.job_id }}
        env: {HQ_JOB_ID: "${{ github.event.inputs.job_id }}", HQ_APP: "${{ github.event.inputs.app }}"}
        run: python -m studio.render_worker --job "$HQ_JOB_ID" --app "$HQ_APP"
