name: ui-smoke
# Real browser run of the whole HuhQueue loop against the sample workspace; screenshots are uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      query: {description: "topic for the agent", required: false, default: "OpenAI"}
  pull_request:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip}
      - run: bash scripts/ci_apt_install.sh ffmpeg
      - run: pip install -q -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt playwright pytest-playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Start the app (sample workspace, local video render)
        env: {STUDIO_INSECURE_COOKIES: "1", PUBLIC_URL: "http://127.0.0.1:8899", STUDIO_DB: "/tmp/ui.db", RENDER_WORKER: "local", HQ_ANON_RPM: "1000", HQ_DEMO_PER_MIN: "60"}
        run: nohup python -m uvicorn studio.app:create_app --factory --port 8899 > /tmp/uv.log 2>&1 & sleep 5 && curl -sf http://127.0.0.1:8899/healthz
      - name: Drive the UI
        env: {HQ_QUERY: "${{ github.event.inputs.query || 'OpenAI' }}"}   # via env, never spliced into the script
        run: python scripts/ui_smoke.py http://127.0.0.1:8899 shots "$HQ_QUERY"
      - name: Make a post v2 + Story scan screenshots (1440 / 390, light / dark) and layout check
        if: always()
        run: python scripts/mpv2_shots.py http://127.0.0.1:8899 shots/mpv2
      - name: Browser tests (e2e, guided tour, responsive)
        if: always()
        run: python -m pytest tests/studio/test_e2e_studio.py tests/studio/test_take_e2e.py tests/studio/test_take_run_view_e2e.py tests/studio/test_browsers.py tests/studio/test_tour_e2e.py tests/studio/test_responsive.py tests/studio/test_activity_e2e.py tests/studio/test_brand_kit_v2_e2e.py tests/studio/test_agent_ux_nov3_e2e.py tests/studio/test_xss_e2e.py tests/studio/test_style_ledger_e2e.py tests/studio/test_chat_ui_e2e.py tests/studio/test_library_premium_e2e.py tests/studio/test_library_bin_e2e.py tests/studio/test_take_bin_e2e.py tests/studio/test_library_one_take_e2e.py tests/studio/test_paid_api_approval_e2e.py tests/studio/test_thread_delete_e2e.py tests/studio/test_chat_model_picker_e2e.py tests/studio/test_link_approval_e2e.py tests/studio/test_thread_url_live_e2e.py -q
      - name: Brand kit switch, brand sources first run, scan to drafts, integrations cards (4 Nov 2026)
        if: always()
        run: python -m pytest "tests/studio/test_brand_kit_builder_e2e.py::test_switch_kits_restyles_the_gallery_start_your_own_and_save" "tests/studio/test_brand_sources_e2e.py::test_brand_studio_first_run_preview_examples_and_slot" "tests/studio/test_brand_sources_e2e.py::test_sources_agent_scan_then_make_a_post_opens_the_composer" "tests/studio/test_news_multi_make_post_e2e.py" "tests/studio/test_new_thread_entry_e2e.py" "tests/studio/test_composer_nov6_e2e.py" "tests/studio/test_integrations_e2e.py::test_settings_integrations_cards_save_test_remove" -q
      - name: View transitions (logo loader on every view switch, 5 Nov 2026)
        if: always()
        run: python -m pytest tests/studio/test_view_loader.py tests/studio/test_view_loader_e2e.py -q
      - name: Demo view-only line e2e (Add sample kit, Disconnect)
        if: always()
        run: python -m pytest tests/studio/test_demo_line_e2e.py -q
      - if: always()
        run: cp /tmp/uv.log shots/server.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: ui-shots, path: shots, retention-days: 7}
