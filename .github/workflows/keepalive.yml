# Render's free web services sleep after 15 idle minutes; ping every 10 so judges never hit a cold start.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://huhqueue-studio.onrender.com/healthz || curl -fsS --max-time 90 https://huhqueue-studio.onrender.com/healthz
