# Supabase pg_cron pings /healthz every 10 minutes (docs/SUPABASE.md), which keeps Render awake and Supabase active
# for free. This is only a backstop: the repo is private, so a 10-minute Actions cron would use more than the 2,000
# free minutes a month.
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://huhqueue-studio.onrender.com/healthz || curl -fsS --max-time 90 https://huhqueue-studio.onrender.com/healthz
