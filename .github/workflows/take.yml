name: take
# One take -> a week: the free video worker for long videos. The app dispatches one run per job:
#   kind=take_analyze  transcribe (faster-whisper small, CPU int8, Silero VAD) + silences + scene cuts + face track
#   kind=take_render   reframe to 9:16, burn in brand captions (libass), cover frame + end card, post each clip back
# No token travels in the inputs (they show on the run page): the run claims its job once with its GitHub OIDC identity
# and gets a token that only works for this job, kept in memory.
on:
  workflow_dispatch:
    inputs:
      job_id: {description: "render_jobs.id", required: true}
      app: {description: "app base URL", required: true, default: "https://huhqueue-studio.onrender.com"}
      kind: {description: "take_analyze | take_render", required: false, default: "take_analyze", type: choice, options: [take_analyze, take_render]}
permissions: {contents: read, id-token: write}
concurrency: {group: "take-${{ github.event.inputs.job_id }}", cancel-in-progress: false}
jobs:
  take:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "requirements-worker*.txt"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgles2 >/dev/null
      - name: Worker dependencies
        env: {HQ_KIND: "${{ github.event.inputs.kind }}"}
        run: |
          if [ "$HQ_KIND" = "take_analyze" ]; then pip install -q -r requirements-worker.txt; else pip install -q -r requirements-worker-core.txt "numpy>=2.0"; fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event.inputs.kind == 'take_analyze'
        with: {path: ~/.cache/huggingface, key: whisper-small-v1}
      - name: Job ${{ github.event.inputs.job_id }} (${{ github.event.inputs.kind }})
        env:
          HQ_JOB_ID: "${{ github.event.inputs.job_id }}"
          HQ_APP: "${{ github.event.inputs.app }}"
          HQ_FACE_MODEL: "/tmp/blaze_face_short_range.tflite"
          # No provider keys here (and no repo secrets): Groq ASR and the Smart layout vision picker are called by the APP
          # with its own keys, on this job's token, under the free-tier ledger (studio/free_proxy.py, studio/free_quota.py).
          HQ_LAYOUT_VISION: shadow                             # asks and logs; the rules still decide (off | shadow | on)
        run: python -m studio.render_worker --job "$HQ_JOB_ID" --app "$HQ_APP"
