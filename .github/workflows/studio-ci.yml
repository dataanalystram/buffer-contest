name: studio-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: studio}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null   # One take render tests use the real FFmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt
      - name: Studio tests on SQLite
        run: python -m pytest tests/studio -q
      - name: Studio tests on Postgres (production store)
        env: {STUDIO_TEST_PG: "postgresql://postgres:test@localhost:5432/studio"}
        run: python -m pytest tests/studio -q
