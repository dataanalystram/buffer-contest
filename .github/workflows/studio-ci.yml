name: studio-ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {contents: read}
jobs:
  # The studio suite runs twice: SQLite (local / self-hosted installs) and Postgres (the live site's store, Supabase).
  # They run as parallel jobs (6 Nov 2026: one after the other took ~35 min); `test` below is the required check and
  # passes only when both do.
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null   # One take render tests use the real FFmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt "numpy>=2.0" "opencv-python-headless>=4.10,<5"   # numpy: studio.media music + render tests; OpenCV: the One take layout golden plans (YuNet)
      - name: Studio tests on SQLite
        run: python -m pytest tests/studio -q
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: studio}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt "numpy>=2.0" "opencv-python-headless>=4.10,<5"
      - name: Studio tests on Postgres (production store)
        env: {STUDIO_TEST_PG: "postgresql://postgres:test@localhost:5432/studio"}
        run: python -m pytest tests/studio -q --ignore-glob="tests/studio/test_media_*"   # media tests use no store; they run on SQLite
  layout-bench:
    # informative only: never fails the build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt "numpy>=2.0" "opencv-python-headless>=4.10,<5"
      - name: One take layout speed on 2 cores (informative, target <= 1.2x realtime)
        timeout-minutes: 8
        run: taskset -c 0,1 python scripts/bench_layouts.py 30 | tee -a "$GITHUB_STEP_SUMMARY"
  test:
    # the required status check (branch protection names "test"): green only when both stores passed
    needs: [test-sqlite, test-postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "sqlite: ${{ needs.test-sqlite.result }}, postgres: ${{ needs.test-postgres.result }}"
          test "${{ needs.test-sqlite.result }}" = success && test "${{ needs.test-postgres.result }}" = success
  core-tests:
    # The root tests/ suite (HuhQueue core: API, connectors, scheduling, scope, MCP/CLI parity, and the Playwright UI
    # tests in tests/e2e). tests/studio runs in the job above. Added 4 Nov 2026: nothing in CI ran these before.
    # tests/e2e/test_deployed.py skips itself unless HUHQ_E2E_URL/HUHQ_E2E_PASSWORD point at a hosted instance.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null   # the video end-card / CTA tests run real FFmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-studio.txt "numpy>=2.0"
      - run: python -m playwright install --with-deps chromium >/dev/null   # before the tests, so a unit failure can't skip it
      - name: Core tests (tests/ without tests/studio and the browser tests)
        run: python -m pytest tests --ignore=tests/studio --ignore=tests/e2e -q -rs
      - name: Core browser tests (tests/e2e)
        if: always()
        run: python -m pytest tests/e2e -q -rs
  worker-imports:
    # The video worker runs in its own venv (take.yml / render.yml), not the web app's: import every module it can reach
    # with only the worker requirements installed (2 Nov 2026: a missing `cryptography` crashed every link -> split).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: take_analyze, install: "-r requirements-worker.txt", flags: ""}
          - {name: take_render, install: "-r requirements-worker-core.txt numpy>=2.0", flags: "--hard-only"}
          - {name: media_render, install: "-r requirements-worker-core.txt -r requirements-media.txt", flags: "--hard-only"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Worker-only venv (${{ matrix.name }})
        run: python -m venv /tmp/w && /tmp/w/bin/pip install -q ${{ matrix.install }}
      - name: Import every worker module
        run: /tmp/w/bin/python scripts/worker_imports.py --import ${{ matrix.flags }}
      - name: Capability self-check (face detector, FFmpeg loudnorm/ass/libx264, faster-whisper) - fails loudly, never degrades
        if: matrix.name != 'media_render'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgles2 >/dev/null && /tmp/w/bin/python -m studio.media.selfcheck --kind ${{ matrix.name }}
      - name: Real face detection (OpenCV Haar + MediaPipe find the face in a public-domain portrait, none in a blank frame; ms per frame)
        # an OpenCV / MediaPipe upgrade that breaks detection fails here, never silently on a take (studio/media/facedetect.py)
        if: matrix.name == 'take_analyze'
        run: /tmp/w/bin/python -m studio.media.facedetect --check --runs 7
